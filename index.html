<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SYAM Admin</title><style>body{font-family:Arial;background:#080d18;color:#eee;margin:0;padding:20px}.box{max-width:900px;margin:auto;background:#111a2c;padding:22px;border-radius:16px}input,select,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border-radius:9px;border:1px solid #30415f;background:#0b1323;color:#fff}button{background:#1857b8;border:0;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.msg{margin-top:10px;padding:10px;border-radius:8px;background:#182642}.table{overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #293752;text-align:left;white-space:nowrap}.muted{opacity:.65;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="box"><h1>SYAM Admin</h1><p class="muted">Account manager untuk backend SYAM milik sendiri.</p><label>Admin Key</label><input id="key" type="password" autocomplete="off"><div class="grid"><div><label>Username</label><input id="username" minlength="5"></div><div><label>Password</label><input id="password" type="password" minlength="6"></div><div><label>Tier</label><select id="tier"><option>BASIC</option><option>PREMIUM</option><option>VIP</option></select></div><div><label>Masa aktif (hari)</label><input id="days" type="number" min="1" max="3650" value="30"></div></div><button onclick="createAccount()">CREATE ACCOUNT</button><button onclick="loadAccounts()">REFRESH ACCOUNTS</button><div id="msg" class="msg" hidden></div><div class="table"><table><thead><tr><th>Username</th><th>Tier</th><th>Status</th><th>Expires</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>const $=id=>document.getElementById(id);function show(x){$('msg').hidden=false;$('msg').textContent=x}function headers(){return {'Content-Type':'application/json','X-Admin-Key':$('key').value}}async function createAccount(){show('Processing...');try{const r=await fetch('/api/create-account.php',{method:'POST',headers:headers(),body:JSON.stringify({username:$('username').value.trim(),password:$('password').value,tier:$('tier').value,days:Number($('days').value)})});const j=await r.json();show(j.message||j.error||JSON.stringify(j));if(j.success)loadAccounts()}catch(e){show('Request gagal: '+e.message)}}async function loadAccounts(){try{const r=await fetch('/api/list-accounts.php',{headers:{'X-Admin-Key':$('key').value}});const j=await r.json();if(!j.success){show(j.error||'Gagal');return}$('rows').innerHTML=j.accounts.map(a=>`<tr><td>${esc(a.username)}</td><td>${esc(a.tier)}</td><td>${esc(a.status)}</td><td>${new Date(a.expires_at*1000).toLocaleString()}</td></tr>`).join('')}catch(e){show(e.message)}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
